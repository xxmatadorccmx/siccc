# ============================================================================
# SICC · Nginx Reverse Proxy + SSL
# Reemplaza TU_DOMINIO.com con tu dominio real
# ============================================================================

# --- HTTP: redirect to HTTPS + Let's Encrypt challenge ---
server {
    listen 80;
    server_name TU_DOMINIO.com www.TU_DOMINIO.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: reverse proxy to the Node.js app ---
server {
    listen 443 ssl;
    http2 on;
    server_name TU_DOMINIO.com www.TU_DOMINIO.com;

    ssl_certificate /etc/letsencrypt/live/TU_DOMINIO.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/TU_DOMINIO.com/privkey.pem;

    # SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Upload size (for compliance documents, receipts, etc.)
    client_max_body_size 15m;

    location / {
        proxy_pass http://app:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
