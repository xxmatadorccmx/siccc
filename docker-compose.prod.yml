# ============================================================================
# SICC · Producción — PostgreSQL + App + Nginx
# Uso: docker compose -f docker-compose.prod.yml up -d
# ============================================================================

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sicc}
      POSTGRES_USER: ${POSTGRES_USER:-sicc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ChangeMe2026}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sicc}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgres://${POSTGRES_USER:-sicc}:${POSTGRES_PASSWORD:-ChangeMe2026}@postgres:5432/${POSTGRES_DB:-sicc}
      JWT_SECRET: ${JWT_SECRET:-ChangeThisJWTSecretInProduction}
      JWT_EXPIRES_IN: 24h
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_etc:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - app

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - certbot_etc:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: >
      /bin/sh -c "trap exit TERM;
      while :; do certbot renew --quiet; sleep 12h; done"

volumes:
  pg_data:
  uploads:
  certbot_etc:
  certbot_www:
